<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script th:src="@{/js/main.js}" type="module" defer></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">


    <title>Document</title>
</head>
<body>
<table width="100%" border="0">
    <tr>
        <td colspan="3" width="100%">
            <table class="header-list" width="100%">
                <tr height="30">
                    <th align="center">Имя</th>
                    <th align="center">Группа</th>
                    <th align="center">Вариант</th>
                </tr>
                <tr>
                    <td align="center">Башлачёв А.П.</td>
                    <td align="center">P3231</td>
                    <td align="center">1046</td>
                </tr>
            </table>
        </td>
    </tr>

    <tr height="100">
        <td colspan="3"></td>
    </tr>

    <tr>
        <td width="30%" class="left-table">
            <form action="#" method="GET" id="form">
                <table width="100%">
                    <tr height="30">
                        <td class="option-label">X</td>
                        <td>
                            <input type="text" id="x-text" class="text-input"
                                   placeholder="-3...3" autocomplete="off">
                        </td>
                    </tr>

                    <tr>
                        <td class="option-label">Y</td>
                        <td>
                            <select name="r" id="y-select">
                                <option value="">choose y</option>
                                <option value="-4">-4</option>
                                <option value="-4">-3</option>
                                <option value="-2">-2</option>
                                <option value="-1">-1</option>
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td class="option-label">R</td>
                        <td>
                            <select name="r" id="r-select">
                                <option value="">choose r</option>
                                <option value="1">1</option>
                                <option value="1.5">1.5</option>
                                <option value="2">2</option>
                                <option value="2.5">2.5</option>
                                <option value="3">3</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td></td>
                        <td align="center">
                            <button type="submit" id="submit-button">submit</button>
                        </td>
                    </tr>
                </table>
            </form>
        </td>

        <td width="10%"></td>

        <td width="60%" rowspan="3" align="center">
            <canvas id="graph" height="800" width="800"></canvas>
        </td>
    </tr>

    <tr height="100">
        <td align="center">
            <p id="error-field"></p>
        </td>
        <td></td>
    </tr>

    <tr>
        <td colspan="2">
            <table width="100%" id="result-table" border="1">
                <thead >
                <tr>
                    <th>id</th>
                    <th>X</th>
                    <th>Y</th>
                    <th>R</th>
                    <th class="wide-col">submit time</th>
                    <th>result</th>
                </tr>
                </thead>
                <tbody id="result-table-body">
                <tr th:each="result : ${results}">
                    <td th:text="${result.id}"></td>
                    <td th:text="${result.point.x}"></td>
                    <td th:text="${result.point.y}"></td>
                    <td th:text="${result.point.r}"></td>
                    <td th:text="${result.submitTime}"></td>
                    <td th:text="${result.hit}"></td>
                </tr>
                </tbody>

            </table>
        </td>
    </tr>
    <tr>
        <td>
            <a th:href="@{/statistics}" class="page-arrow">
            →
            </a>
        </td>
    </tr>
</table>

</body>
</html>
